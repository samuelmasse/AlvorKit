# Builds and publishes the managed packages generated from C headers.
#
# Release rule:
# - automatic standalone binding releases only run when version/BINDING_REVISION changes.
# - native package releases are standalone in native-packages.yml and never
#   publish managed bindings.
# - publish bindings after the referenced native package version exists on NuGet.
#
# Manual runs are artifact-oriented unless publishing is explicitly enabled.
name: C header bindings packages
# MiniAudio is released with its native ABI matrix by miniaudio-release.yml.

on:
  # Manual dispatch can build one binding package or all C-header bindings.
  workflow_dispatch:
    inputs:
      library:
        description: Binding library to build
        required: true
        default: all
        type: choice
        options:
          - all
          - fastnoise2
          - freetype
          - glfw
          - interception-profiler
          - nfde
      publish:
        description: Publish generated binding packages to NuGet.org
        required: true
        default: false
        type: boolean

  # Push releases are intentionally limited to binding revision files.
  # Changes to bindgen code/config alone should not publish unless a binding
  # version marker is bumped.
  push:
    branches: [main]
    paths:
      [
        "native/fastnoise2/version/BINDING_REVISION",
        "native/freetype/version/BINDING_REVISION",
        "native/glfw/version/BINDING_REVISION",
        "native/interception-profiler/version/BINDING_REVISION",
        "native/nfde/version/BINDING_REVISION",
      ]

permissions:
  contents: read

# Package versions are immutable; serialize releases per ref instead of canceling
# older runs mid-publish.
concurrency:
  group: c-header-bindings-${{ github.ref }}
  cancel-in-progress: false

# Keep .NET command noise down in every job.
env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Builds a dynamic matrix of binding packages to process. This keeps a freetype
  # version/BINDING_REVISION bump from generating all bindings.
  detect:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_packages: ${{ steps.detect.outputs.has_packages }}
    steps:
      # Fetch full history so push runs can inspect exactly which files changed.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Selects libraries by manual input or changed version/BINDING_REVISION files.
      - name: Detect binding packages to release
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # Manual runs use the explicit input. Push runs derive selection from
          # changed version/BINDING_REVISION marker files.
          selected=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selection="${{ inputs.library }}"
            if [[ "$selection" == "all" ]]; then
              selected=(fastnoise2 freetype glfw interception-profiler nfde)
            else
              selected=("$selection")
            fi
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              if ! changed_output="$(git diff-tree --root --no-commit-id --name-only -r "$head")"; then
                echo "::error::Could not inspect the pushed commit $head."
                exit 1
              fi
            else
              # A non-fast-forward push can leave the previous tip unreachable
              # from every current branch even after a full-history checkout.
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$base"
              fi
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                echo "::error::Could not load the previous push tip $base."
                exit 1
              fi
              if ! changed_output="$(git diff --name-only "$base" "$head")"; then
                echo "::error::Could not compare push tips $base and $head."
                exit 1
              fi
            fi

            changed=()
            if [[ -n "$changed_output" ]]; then
              mapfile -t changed <<< "$changed_output"
            fi

            changed_any() {
              local path="$1"
              local file
              for file in "${changed[@]}"; do
                [[ "$file" == "$path" ]] && return 0
              done
              return 1
            }

            # version/BINDING_REVISION means "publish a new managed binding version".
            for library in fastnoise2 freetype glfw interception-profiler nfde; do
              if changed_any "native/${library}/version/BINDING_REVISION"; then
                selected+=("$library")
              fi
            done
          fi

          # Map each selected library to its package IDs and generated project
          # names. The pack job uses this JSON as its matrix.
          objects=()
          for library in "${selected[@]}"; do
            case "$library" in
              fastnoise2)
                id="alvorkit.fastnoise2"
                native_id="alvorkit.fastnoise2.native"
                api_project="AlvorKit.FastNoise2"
                backend_project="AlvorKit.FastNoise2.Backend"
                ;;
              freetype)
                id="alvorkit.freetype"
                native_id="alvorkit.freetype.native"
                api_project="AlvorKit.FreeType"
                backend_project="AlvorKit.FreeType.Backend"
                ;;
              glfw)
                id="alvorkit.glfw"
                native_id="alvorkit.glfw.native"
                api_project="AlvorKit.GLFW"
                backend_project="AlvorKit.GLFW.Backend"
                ;;
              interception-profiler)
                id="alvorkit.interception.profiler"
                native_id="alvorkit.interception.profiler.native"
                api_project="AlvorKit.Interception.Profiler"
                backend_project="AlvorKit.Interception.Profiler.Backend"
                ;;
              nfde)
                id="alvorkit.nfde"
                native_id="alvorkit.nfde.native"
                api_project="AlvorKit.NFDe"
                backend_project="AlvorKit.NFDe.Backend"
                ;;
              *)
                echo "::error::Unknown binding library '$library'."
                exit 1
                ;;
            esac

            version_root="native/$library/version"
            tag="$(tr -d '[:space:]' < "$version_root/TAG")"
            native_revision="$(tr -d '[:space:]' < "$version_root/REVISION" 2>/dev/null || true)"
            binding_revision="$(tr -d '[:space:]' < "$version_root/BINDING_REVISION" 2>/dev/null || true)"
            binding_revision="${binding_revision:-$native_revision}"
            native_version="$tag${native_revision:+.$native_revision}"
            binding_version="$tag${binding_revision:+.$binding_revision}"

            if [[ "${{ github.event_name }}" == "push" || "${{ inputs.publish }}" == "true" ]]; then
              versions="$(curl -fsSL "https://api.nuget.org/v3-flatcontainer/$id/index.json" || echo '{"versions":[]}')"
              if jq -e --arg version "$binding_version" '.versions | index($version)' <<< "$versions" > /dev/null; then
                if [[ "${{ github.event_name }}" == "push" ]]; then
                  echo "::error::$id $binding_version is already published - bump $version_root/BINDING_REVISION."
                  exit 1
                fi
                echo "$id $binding_version is already published; skipping."
                continue
              fi
            fi

            objects+=("$(jq -cn \
              --arg selection "$library" \
              --arg native_version "$native_version" \
              --arg native_id "$native_id" \
              --arg api_project "$api_project" \
              --arg backend_project "$backend_project" \
              '{selection:$selection,native_version:$native_version,native_id:$native_id,api_project:$api_project,backend_project:$backend_project}')")
          done

          # Emit compact JSON for fromJson(...) and a simple boolean for job
          # conditions.
          packages="$(printf '%s\n' "${objects[@]}" | jq -s -c '.')"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [[ "$packages" == "[]" ]]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "No binding packages selected for this run."
          else
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
            echo "Selected packages: $(jq -r 'map(.selection) | join(", ")' <<< "$packages")"
          fi

  # Generates, packs, artifacts, and optionally publishes the selected bindings.
  pack:
    # Keep this static because GitHub does not expand matrix expressions when
    # the job-level condition skips the matrix before expansion.
    name: bindings packages
    needs: [detect]
    if: needs.detect.outputs.has_packages == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}

    steps:
      # Check out metadata/source and install the SDK used by the bindgen tool.
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      # The generated backend references the native runtime package, so verify
      # that the required native package version already exists before generation.
      - name: Verify native package is published
        shell: bash
        run: |
          set -euo pipefail
          versions="$(curl -fsSL "https://api.nuget.org/v3-flatcontainer/${{ matrix.package.native_id }}/index.json" || echo '{"versions":[]}')"
          if ! jq -e --arg version "${{ matrix.package.native_version }}" '.versions | index($version)' <<< "$versions" > /dev/null; then
            echo "::error::${{ matrix.package.native_id }} ${{ matrix.package.native_version }} is not on NuGet.org yet."
            exit 1
          fi

      # Run bindgen in strict mode so missing exports, stale shims, layout issues,
      # and parser problems fail the release.
      - name: Generate bindings
        run: dotnet run --project scripts/AlvorKit.Script.Bindgen -- ${{ matrix.package.selection }} --strict --setup-local

      # Pack both generated projects for this library.
      - name: Pack bindings
        run: |
          dotnet pack -c Release out/bindgen/${{ matrix.package.api_project }}/${{ matrix.package.api_project }}.csproj
          dotnet pack -c Release out/bindgen/${{ matrix.package.backend_project }}/${{ matrix.package.backend_project }}.csproj

      # Upload .nupkg files for visibility and manual review.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package.selection }}-bindings-nupkg
          path: |
            bin/${{ matrix.package.api_project }}/Release/*.nupkg
            bin/${{ matrix.package.backend_project }}/Release/*.nupkg
          if-no-files-found: error

  publish:
    needs: [detect, pack]
    if: needs.detect.outputs.has_packages == 'true' && (github.event_name == 'push' || inputs.publish)
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}
    permissions:
      id-token: write
    uses: ./.github/workflows/nuget-publish.yml
    with:
      artifact: ${{ matrix.package.selection }}-bindings-nupkg
      package-ids: ${{ matrix.package.api_project }} ${{ matrix.package.backend_project }}
