# Builds, verifies, packs, and optionally publishes the Windows x64, Linux
# x64/Arm64, and macOS Arm64 interception-profiler native package.
name: interception profiler native package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the native package to NuGet.org
        required: true
        default: false
        type: boolean

  pull_request:
    paths:
      [
        ".github/workflows/interception-profiler-native.yml",
        "AlvorKit.Packages.props",
        "native/interception-profiler/**",
        "res/templates/native-build/**",
        "scripts/AlvorKit.Script.NativeBuild/**",
        "scripts/AlvorKit.Script.TestInterception/**",
        "scripts/AlvorKit.Script.Workspace/**",
        "tests/AlvorKit.Script.NativeBuild.Test/**",
        "tests/AlvorKit.Script.TestInterception.Test/**",
      ]

  # Native package versions are immutable. A main-branch push publishes only
  # when the profiler's native version marker changes.
  push:
    branches: [main]
    paths: ["native/interception-profiler/version/TAG", "native/interception-profiler/version/REVISION"]

permissions:
  contents: read

concurrency:
  group: interception-profiler-native-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
            library: native/interception-profiler/runtimes/win-x64/native/AlvorKit.Interception.Profiler.Native.dll
          - rid: linux-x64
            runner: ubuntu-24.04
            library: native/interception-profiler/runtimes/linux-x64/native/libAlvorKit.Interception.Profiler.Native.so
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            library: native/interception-profiler/runtimes/linux-arm64/native/libAlvorKit.Interception.Profiler.Native.so
          - rid: osx-arm64
            runner: macos-15
            library: native/interception-profiler/runtimes/osx-arm64/native/libAlvorKit.Interception.Profiler.Native.dylib

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read pinned CoreCLR tag
        id: coreclr
        shell: pwsh
        run: |
          $tag = (Get-Content native/interception-profiler/version/CORECLR_TAG -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
              throw "native/interception-profiler/version/CORECLR_TAG is empty."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out pinned CoreCLR headers
        uses: actions/checkout@v6
        with:
          repository: dotnet/runtime
          ref: ${{ steps.coreclr.outputs.tag }}
          path: out/upstream/dotnet-runtime
          sparse-checkout: |
            src/coreclr/inc
            src/coreclr/pal/prebuilt/inc
            src/coreclr/pal/inc
            src/native/minipal

      - name: Test repository-source native builds
        run: >
          dotnet test
          tests/AlvorKit.Script.NativeBuild.Test/AlvorKit.Script.NativeBuild.Test.csproj
          --filter FullyQualifiedName~LibraryBuildContextTest
          --verbosity minimal

      - name: Build profiler
        env:
          ALVORKIT_CORECLR_SOURCE: ${{ github.workspace }}/out/upstream/dotnet-runtime
        run: >
          dotnet run
          --project scripts/AlvorKit.Script.NativeBuild
          --
          build interception-profiler
          --rid ${{ matrix.rid }}

      - name: Verify profiler artifact
        shell: pwsh
        run: |
          & native/interception-profiler/verify/Verify-ProfilerArtifact.ps1 `
              -LibraryPath "${{ matrix.library }}" `
              -RuntimeIdentifier "${{ matrix.rid }}"

      - name: Prove isolated profiled child launch
        env:
          ALVORKIT_INTERCEPTION_PROFILER_PATH: ${{ github.workspace }}/${{ matrix.library }}
        run: >
          dotnet test
          tests/AlvorKit.Script.TestInterception.Test/AlvorKit.Script.TestInterception.Test.csproj
          --filter FullyQualifiedName~ProfiledRunsFollowedByPlainRun_IsolateProfilerActivation
          --verbosity minimal

      - name: Prove ReJIT install, replacement, and revert
        run: >
          dotnet run
          --project scripts/AlvorKit.Script.TestInterception
          --
          --test-project tests/AlvorKit.Interception.CallerProof.Test/AlvorKit.Interception.CallerProof.Test.csproj
          --configuration Release
          --filter FullyQualifiedName=AlvorKit.Interception.CallerProof.Test.LateMetadataGenerationProfilerTest.GenerationRelocatesLateCalliSignatureIdempotently
          --profiler-path ${{ github.workspace }}/${{ matrix.library }}
          --module AlvorKit.Interception.CallerProof.Test
          --timeout-seconds 120

      - name: Upload native profiler runtime
        uses: actions/upload-artifact@v7
        with:
          name: interception-profiler-native-${{ matrix.rid }}
          path: ${{ matrix.library }}
          if-no-files-found: error

  pack:
    name: pack native profiler
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: interception-profiler-native-win-x64
          path: native/interception-profiler/runtimes/win-x64/native

      - uses: actions/download-artifact@v8
        with:
          name: interception-profiler-native-linux-x64
          path: native/interception-profiler/runtimes/linux-x64/native

      - uses: actions/download-artifact@v8
        with:
          name: interception-profiler-native-linux-arm64
          path: native/interception-profiler/runtimes/linux-arm64/native

      - uses: actions/download-artifact@v8
        with:
          name: interception-profiler-native-osx-arm64
          path: native/interception-profiler/runtimes/osx-arm64/native

      - name: Pack native profiler
        run: >
          dotnet pack
          native/interception-profiler/AlvorKit.Interception.Profiler.Native.csproj
          --configuration Release

      - name: Verify package runtime assets
        shell: pwsh
        run: |
          $packageRoot = "bin/AlvorKit.Interception.Profiler.Native/Release"
          $packages = @(Get-ChildItem -LiteralPath $packageRoot -Filter "*.nupkg" -File)
          if ($packages.Count -ne 1) {
              throw "Expected exactly one native package under $packageRoot; found $($packages.Count)."
          }
          $archive = [IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
              $entries = @($archive.Entries.FullName)
              $expected = @(
                  "runtimes/win-x64/native/AlvorKit.Interception.Profiler.Native.dll",
                  "runtimes/linux-x64/native/libAlvorKit.Interception.Profiler.Native.so",
                  "runtimes/linux-arm64/native/libAlvorKit.Interception.Profiler.Native.so",
                  "runtimes/osx-arm64/native/libAlvorKit.Interception.Profiler.Native.dylib"
              )
              $missing = @($expected | Where-Object { $_ -notin $entries })
              if ($missing.Count -gt 0) {
                  throw "Native package is missing runtime assets: $($missing -join ', ')"
              }
          }
          finally {
              $archive.Dispose()
          }

      - name: Upload native profiler package
        uses: actions/upload-artifact@v7
        with:
          name: interception-profiler-native-nupkg
          path: bin/AlvorKit.Interception.Profiler.Native/Release/*.nupkg
          if-no-files-found: error

  publish:
    name: publish native profiler
    needs: [pack]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: interception-profiler-native-nupkg
          path: bin/AlvorKit.Interception.Profiler.Native/Release

      - name: Require an unpublished package version
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        run: |
          $versionRoot = "native/interception-profiler/version"
          $version = (Get-Content "$versionRoot/TAG" -Raw).Trim()
          $revisionPath = "$versionRoot/REVISION"
          if (Test-Path -LiteralPath $revisionPath) {
              $revision = (Get-Content $revisionPath -Raw).Trim()
              if (-not [string]::IsNullOrWhiteSpace($revision)) {
                  $version = "$version.$revision"
              }
          }
          $packageId = "alvorkit.interception.profiler.native"
          $index = "https://api.nuget.org/v3-flatcontainer/$packageId/index.json"
          try {
              $published = (Invoke-RestMethod -Uri $index).versions
          }
          catch {
              if ($_.Exception.Response.StatusCode -ne [System.Net.HttpStatusCode]::NotFound) {
                  throw
              }
              $published = @()
          }
          if ($published -contains $version) {
              throw "AlvorKit.Interception.Profiler.Native $version is already published."
          }

      - name: Publish native profiler
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        run: |
          $packageRoot = "bin/AlvorKit.Interception.Profiler.Native/Release"
          $packages = @(Get-ChildItem -LiteralPath $packageRoot -Filter "*.nupkg" -File)
          if ($packages.Count -ne 1) {
              throw "Expected exactly one native package under $packageRoot; found $($packages.Count)."
          }
          dotnet nuget push $packages[0].FullName `
              --api-key "${{ secrets.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed with exit code $LASTEXITCODE."
          }
