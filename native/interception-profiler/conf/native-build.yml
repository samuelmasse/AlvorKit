kind: cmake
repositorySource: true
windows:
  cmakeOutput: AlvorKit.Interception.Profiler.Native.dll
  ridCMakeOptions:
    win-x64:
      - -DALVORKIT_PROFILER_RID=win-x64
  allowedDependencies:
    - KERNEL32.dll
    - OLE32.dll
linux:
  packages:
    - build-essential
    - cmake
  cmakeOutput: libAlvorKit.Interception.Profiler.Native.so
  ridCMakeOptions:
    linux-x64:
      - -DALVORKIT_PROFILER_RID=linux-x64
    linux-arm64:
      - -DALVORKIT_PROFILER_RID=linux-arm64
  allowedDependencies:
    - libc.so.6
    - libdl.so.2
    - libgcc_s.so.1
    - libm.so.6
    - libpthread.so.0
    - libstdc++.so.6
